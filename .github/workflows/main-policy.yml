name: Main branch policy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  source:
    name: Main source branch
    runs-on: ubuntu-latest
    steps:
      - name: Require this repository's dev branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != dev || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo '::error::Only this repository’s dev branch can merge into main.'
            exit 1
          fi
